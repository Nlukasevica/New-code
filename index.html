<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Web Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.5s ease;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            text-align: center;
            position: relative;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
            font-size: 1.1em;
        }
        
        .button {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s ease;
            border: none;
            cursor: pointer;
            margin: 10px;
        }
        
        .button:hover {
            background: #764ba2;
        }
        
        .color-button {
            background: #ff6b6b;
        }
        
        .color-button:hover {
            background: #ee5a52;
        }
        
        .button-group {
            margin-top: 30px;
        }
        
        .firework {
            position: fixed;
            font-size: 2em;
            pointer-events: none;
            animation: fall 2s ease-out forwards;
        }
        
        @keyframes fall {
            to {
                transform: translateY(500px) translateX(100px) rotateZ(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Claude</h1>
        <p>This is a new web page built with Claude AI assistance.</p>
        <p>Click the "Change Color" button to see the magic!</p>
        
        <div class="button-group">
            <button class="button" onclick="alert('Hello from Claude!')">Click Me</button>
            <button class="button color-button" onclick="changeColorWithFireworks()">Change Color</button>
        </div>
    </div>

    <script>
        const colors = [
            'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
            'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
            'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
            'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
            'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
            'linear-gradient(135deg, #30cfd0 0%, #330867 100%)'
        ];
        
        const fireworks = ['🎆', '✨', '🎇', '⭐', '💫'];
        let currentColorIndex = 0;
        
        function createFirework(x, y) {
            const firework = document.createElement('div');
            firework.className = 'firework';
            firework.textContent = fireworks[Math.floor(Math.random() * fireworks.length)];
            firework.style.left = x + 'px';
            firework.style.top = y + 'px';
            
            document.body.appendChild(firework);
            
            setTimeout(() => {
                firework.remove();
            }, 2000);
        }
        
        function changeColorWithFireworks() {
            currentColorIndex = (currentColorIndex + 1) % colors.length;
            document.body.style.background = colors[currentColorIndex];
            
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const x = Math.random() * window.innerWidth;
                    const y = Math.random() * window.innerHeight;
                    createFirework(x, y);
                }, i * 50);
            }
        }
    </script>
</body>
</html>
